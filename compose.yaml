services:
  hallucinatettp:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your environment}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-4}
      HTTP_ARCHIVE_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./http-archive:/data
